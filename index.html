<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Challenge: The boxer model</title>
        <style>
            body {
                font-family: cursive;
            }
            .photo-gallery {
                background: rgb(255, 254, 217);
                padding: 10px;
                width: fit-content;
                margin: auto;
            }
            .photo {
                width: 200px;
                border: 5px dashed wheat;
                margin: 10px;
            }

            h1 {
            width: fit-content;
            overflow: hidden; /* Ensures the content is not revealed until the animation */
            border-right: .15em solid orange; /* The typwriter cursor */
            white-space: nowrap;
            letter-spacing: .15em; /* Adjust as needed */
            animation: 
            typing 3.5s steps(40, end),
            blink-caret .75s step-end infinite;
            }

            /* The typing effect */
            @keyframes typing {
            from { width: 0 }
            to { width: 100% }
            }

            /* The typewriter cursor effect */
            @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: orange; }
            }

            /* Copy code to element you want to animate */
h2{
    animation: GELATINOUS 2s linear 0s infinite normal both;
/* Copy this code after the above code */}
@keyframes GELATINOUS {
  0% {
	transform: scale3d(1, 1, 1);
  }

  30% {
	transform: scale3d(0.75, 1.25, 1);
  }

  40% {
	transform: scale3d(1.25, 0.75, 1);
  }

  50% {
	transform: scale3d(0.85, 1.15, 1);
  }

  65% {
	transform: scale3d(1.05, 0.95, 1);
  }

  75% {
	transform: scale3d(0.95, 1.05, 1);
  }

  100% {
	transform: scale3d(1, 1, 1);
  }
}

        h3:hover{
            animation-name: spinny;
            animation-duration: 5s;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
        }

        @keyframes spinny{
            from{
                transform: rotate(0deg);
            }
            to{
                transform: rotate(720deg);
            }
            }
        }
        </style>
    </head>
    <body>

        <h1>Boxers are beautiful?</h1>
        <h2> woahhhhh</h2>

</html>
